{%- assign w = include.w | default: '70%' -%}
{%- assign loading = include.loading | default: 'lazy' -%}
{%- capture style -%}--w:{{ w }}{% if include.ratio %};--ar:{{ include.ratio }}{% endif %}{%- endcapture -%}
<figure class="post-figure" style="{{ style }}">
  <img
    src="{{ include.url | relative_url }}"
    alt="{{ include.alt | default: include.cap | default: '' }}"
    loading="{{ loading }}"
    decoding="async"
    {% if loading == 'eager' %}fetchpriority="high"{% endif %}>
  {%- if include.cap -%}
    <figcaption>{{ include.cap }}</figcaption>
  {%- endif -%}
</figure>
