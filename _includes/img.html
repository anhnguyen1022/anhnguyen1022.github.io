<figure class="post-figure">
  <img 
    src="{{ include.url | relative_url }}" 
    alt="" 
    loading="lazy" 
    decoding="async"
    fetchpriority="low"
    style="width: {{ include.w | default: '70%' }};"
  >
  {% if include.cap %}
    <figcaption>{{ include.cap }}</figcaption>
  {% endif %}
</figure>
