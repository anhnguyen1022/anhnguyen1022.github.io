<header class="site-header">
  <nav class="nav-container">
    <a href="{{ "/" | relative_url }}" class="site-title"><b>{{ site.title | escape }}</b></a>
    <div class="nav-links">
      {%- for page in site.pages -%}
        {%- if page.title -%}
        <a class="page-link" href="{{ page.url | relative_url }}">{{ page.title | escape }}</a>
        {%- endif -%}
      {%- endfor -%}
    </div>
  </nav>
</header>
