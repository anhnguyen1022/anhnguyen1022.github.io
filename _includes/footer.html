<footer class="site-footer">
  <div class="wrapper" style="text-align: center;">
    <div class="footer-col-wrapper" style="display: block;">
      
      <div class="footer-github-central">
        <a href="https://github.com/{{ site.github_username }}" target="_blank" style="text-decoration: none; color: #828282;">
          <svg class="svg-icon" style="width: 20px; height: 20px; vertical-align: middle; fill: #828282; margin-right: 5px;">
            <use xlink:href="{{ '/assets/minima-social-icons.svg#github' | relative_url }}"></use>
          </svg>
          <span class="username" style="font-size: 16px; vertical-align: middle;">{{ site.github_username }}</span>
        </a>
      </div>

      <div style="margin-top: 10px; font-size: 13px; color: #b5b5b5;">
        © {{ "now" | date: "%Y" }} • {{ site.title }}
      </div>

    </div>
  </div>
</footer>
