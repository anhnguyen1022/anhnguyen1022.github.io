---
layout: default
seo:
  noindex: true
---
<style>
  .post-link {
    text-decoration: none !important;
    color: #0066cc;
    font-size: 0.9em !important; 
    font-weight: 400 !important;
    line-height: 1.2; /* Giảm chiều cao dòng của tiêu đề */
  }
  
  .post-link:hover {
    text-decoration: underline !important;
    text-underline-offset: 2px !important;
  }

  .post-date {
    flex: 0 0 110px; 
    color: #555; 
    font-family: monospace; 
    font-size: 0.95em;
    font-weight: 400;
    white-space: nowrap; 
  }

  .post-item {
    display: flex; 
    align-items: baseline; 
    /* Chỉnh con số này nhỏ xuống (ví dụ 2px hoặc 0px) để các hàng sát nhau hơn */
    margin-bottom: 2px; 
    column-gap: 15px; 
  }

  .post-list {
    list-style: none; 
    padding: 0; 
    margin-top: 15px; /* Khoảng cách giữa nội dung trên và danh sách bài viết */
  }
</style>

<div class="home">
  {{ content }}

  <ul class="post-list">
    {% for post in site.posts %}
    <li class="post-item">
      
      <span class="post-date">
        {{ post.date | date: "%d/%m/%Y" }}
      </span>
      
      <span style="flex: 1;">
        <a class="post-link" href="{{ post.url | relative_url }}">
          {{ post.title }}
        </a>
      </span>

    </li>
    {% endfor %}
  </ul>
</div>
