---
layout: default
seo:
  noindex: true
---

<div class="home">
  {{ content }}

  <ul class="post-list">
    {% for post in site.posts %}
    <li class="post-item">
      
      <!-- Cột ngày tháng -->
      <span class="post-date">
        {{ post.date | date: "%d/%m/%Y" }}
      </span>
      
      <!-- Cột tiêu đề -->
      <span style="flex: 1;">
        <a class="post-link" href="{{ post.url | relative_url }}">
          {{ post.title }}
        </a>
      </span>

    </li>
    {% endfor %}
  </ul>
</div>
