---
layout: default
seo:
  noindex: true
---

<div class="home">
  {{ content }}

  <ul class="home-post-list">
    {% for post in site.posts %}
    <li class="home-post-item">
      
      <!-- Cột ngày tháng -->
      <span class="post-date">
        {{ post.date | date: "%d/%m/%Y" }}
      </span>
      
      <!-- Cột tiêu đề -->
      <span class="home-post-title">
        <a class="post-link" href="{{ post.url | relative_url }}">
          {{ post.title }}
        </a>
      </span>

    </li>
    {% endfor %}
  </ul>
</div>
