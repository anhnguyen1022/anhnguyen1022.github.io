---
layout: default
---

<div class="home">
  {%- if page.title -%}
    <h1 class="page-heading">{{ page.title }}</h1>
  {%- endif -%}

  {{ content }}

  {%- if site.posts.size > 0 -%}
    <ul class="post-list" style="list-style: none; margin: 20px 0 0 0; padding: 0;">
      {%- for post in site.posts -%}
      <li style="margin-bottom: 8px;"> <!-- Khoảng cách giữa các dòng hẹp hơn giống Bear Blog -->
        <div style="display: flex; align-items: flex-start; line-height: 1.5;">
          
          <!-- Cột trái: Ngày tháng (Màu xám, phông chữ đồng nhất) -->
          <time datetime="{{ post.date | date_to_xmlschema }}" style="flex: 0 0 110px; color: #666; font-family: monospace;">
            {{ post.date | date: "%d %b, %Y" }}
          </time>

          <!-- Cột phải: Tiêu đề bài viết -->
          <div style="flex: 1;">
            <a class="post-link" href="{{ post.url | relative_url }}" style="text-decoration: none; color: #0044cc; font-weight: 400;">
              {{ post.title | escape }}
            </a>
          </div>

        </div>
      </li>
      {%- endfor -%}
    </ul>
  {%- endif -%}
</div>
