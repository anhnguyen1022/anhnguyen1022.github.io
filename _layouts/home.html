---
layout: default
seo:
  noindex: true
---
<style>
  .post-link {
    text-decoration: none !important;
    color: #0066cc;
    font-size: 0.9em !important; 
    font-weight: 400 !important;
    line-height: 1.5;
  }
  
  .post-link:hover {
    text-decoration: underline !important;
    text-underline-offset: 1px !important;
  }

  .post-date {
    flex: 0 0 110px; 
    color: #555; 
    font-family: monospace; 
    font-size: 0.95em;
    font-weight: 400;
    white-space: nowrap; 
  }

  .post-item {
    display: flex; 
    align-items: baseline; 
    margin-bottom: 5px;
    column-gap: 15px; 
  }
</style>

<div class="home">
  {{ content }}

  <ul class="post-list" style="list-style: none; padding: 0; margin-top: 20px;">
    {% for post in site.posts %}
    <li class="post-item">
      
      <!-- Cột ngày tháng: Đã đổi sang định dạng Ngày/Tháng/Năm -->
      <span class="post-date">
        {{ post.date | date: "%d/%m/%Y" }}
      </span>
      
      <!-- Cột tiêu đề -->
      <span style="flex: 1;">
        <a class="post-link" href="{{ post.url | relative_url }}">
          {{ post.title }}
        </a>
      </span>

    </li>
    {% endfor %}
  </ul>
</div>
