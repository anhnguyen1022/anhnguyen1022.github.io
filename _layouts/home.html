---
layout: default
seo:
  noindex: true
---
  {{ content }}
  <ul class="post-list">
    {%- for post in site.posts -%}
    <li class="post-item">
      <time class="post-date">
        {{ post.date | date: "%d/%m/%Y" }}
      </time>
      <a class="post-link" href="{{ post.url | relative_url }}">
          {{ post.title }}
      </a>
    </li>
    {%- endfor -%}
  </ul>
