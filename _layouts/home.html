---
layout: default
seo:
  noindex: true
---
<style>
  .post-link {
    text-decoration: none !important;
    color: #0066cc;
    font-size: 1em !important; 
    font-weight: 400 !important;
    line-height: 1.5;
  }
  
  .post-link:hover {
    text-decoration: underline !important;
    text-underline-offset: 1px !important;
    color: #0066cc;
  }

  .post-date {
    flex: 0 0 110px; 
    color: #555; 
    font-family: monospace; 
    font-size: 1em;
    font-weight: 400;
  }
</style>

<div class="home">
  {{ content }}

  <ul class="post-list" style="list-style: none; padding: 0; margin-top: 10px;">
    {% for post in site.posts %}
    <li style="margin-bottom: 5px; display: flex; align-items: baseline;">
      
      <!-- Cột ngày tháng -->
      <span class="post-date">
        {{ post.date | date: "%d/%m/%Y" }}
      </span>
      
      <!-- Cột tiêu đề -->
      <span style="flex: 1;">
        <a class="post-link" href="{{ post.url | relative_url }}">
          {{ post.title }}
        </a>
      </span>

    </li>
    {% endfor %}
  </ul>
</div>
